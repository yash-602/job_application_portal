spring.application.name=job-application-tracker
server.port=${PORT:8080}

# MongoDB - use SPRING_DATA_MONGODB_URI in Render (Spring Boot native convention, applied at runtime)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/job_tracker_db}

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${SPRING_MAIL_USERNAME:test}
spring.mail.password=${SPRING_MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET:dev-secret-key-minimum-32-chars-long-local-only}
# 15 minutes
jwt.access-token-expiration-ms=900000
# 7 days
jwt.refresh-token-expiration-ms=604800000

cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAMESITE:Lax}
